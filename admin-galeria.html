<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel da Galeria | C Alves Ceron</title><script src="https://cdn.tailwindcss.com"></script>
<style>body{background:#020617;color:#f8fafc;font-family:Inter,system-ui,sans-serif}.gold{color:#fbbf24}.field{width:100%;border:1px solid #334155;background:#020617;border-radius:.75rem;padding:.75rem;color:white}</style>
</head>
<body>
<header class="border-b border-slate-800 bg-slate-950"><div class="mx-auto flex max-w-5xl items-center justify-between px-4 py-5"><div><p class="gold text-xs font-bold uppercase tracking-widest">C Alves Ceron Construções</p><h1 class="text-2xl font-black">Painel da Galeria</h1></div><a href="./galeria.html" class="text-sm text-amber-300 underline">Ver galeria pública</a></div></header>
<main class="mx-auto max-w-5xl px-4 py-8">
<section id="loginBox" class="mx-auto max-w-md rounded-2xl border border-slate-800 bg-slate-900 p-6">
<h2 class="mb-2 text-xl font-bold">Acesso administrativo</h2><p class="mb-5 text-sm text-slate-400">Entre com a conta autorizada no Firebase Authentication.</p>
<form id="loginForm" class="space-y-4"><label class="block text-sm">E-mail<input id="email" class="field mt-1" type="email" required autocomplete="username"></label><label class="block text-sm">Senha<input id="password" class="field mt-1" type="password" required autocomplete="current-password"></label><button class="w-full rounded-xl bg-amber-400 px-4 py-3 font-extrabold text-slate-950">Entrar</button></form><p id="loginMsg" class="mt-4 text-sm text-rose-300"></p>
</section>
<section id="adminBox" class="hidden">
<div class="mb-6 flex flex-wrap items-center justify-between gap-3"><p id="signedIn" class="text-sm text-slate-400"></p><button id="logout" class="rounded-xl border border-slate-700 px-4 py-2">Sair</button></div>
<div class="grid gap-8 lg:grid-cols-[1fr_1fr]">
<form id="workForm" class="space-y-4 rounded-2xl border border-slate-800 bg-slate-900 p-6">
<h2 class="text-xl font-extrabold">Cadastrar / editar obra</h2><input id="workId" type="hidden">
<label class="block text-sm">Título da obra *<input id="title" class="field mt-1" required maxlength="120"></label>
<label class="block text-sm">Cliente (nome ou identificação)<input id="client" class="field mt-1" maxlength="120" placeholder="Ex.: Cliente particular (com autorização)"></label>
<label class="block text-sm">Cidade / UF *<input id="workCity" class="field mt-1" required placeholder="Ex.: São João do Ivaí - PR"></label>
<label class="block text-sm">Tipo de serviço *<select id="workCategory" class="field mt-1" required><option>Casas</option><option>Prédios Residenciais</option><option>Prédios Comerciais</option><option>Fundações / Brocas</option><option>Obras em Geral</option></select></label>
<label class="block text-sm">Descrição geral<textarea id="description" class="field mt-1" rows="3" maxlength="1000"></textarea></label>
<label class="block text-sm">Fotos da obra (selecione uma ou várias)<input id="photos" class="field mt-1" type="file" accept="image/*" multiple></label>
<p class="text-xs text-slate-400">Cada foto poderá ter uma legenda depois do envio. Use imagens que você tem autorização para publicar.</p>
<label class="flex items-center gap-2 text-sm"><input id="published" type="checkbox" checked> Publicar na galeria</label>
<div class="flex flex-wrap gap-3"><button class="rounded-xl bg-amber-400 px-5 py-3 font-extrabold text-slate-950">Salvar obra</button><button id="clearForm" type="button" class="rounded-xl border border-slate-700 px-5 py-3">Limpar</button></div>
<p id="formMsg" class="text-sm text-slate-300"></p>
</form>
<section class="rounded-2xl border border-slate-800 bg-slate-900 p-6"><h2 class="mb-4 text-xl font-extrabold">Obras cadastradas</h2><div id="workList" class="space-y-3"></div></section>
</div>
</section>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,addDoc,updateDoc,doc,getDocs,deleteDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getStorage,ref,uploadBytes,getDownloadURL,deleteObject} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
import {firebaseConfig} from "./firebase-config.js";
const $=id=>document.getElementById(id);
const loginBox=$("loginBox"),adminBox=$("adminBox");
let auth,db,storage,currentUser=null,works=[];
try {
 if(!firebaseConfig.apiKey || firebaseConfig.apiKey==="COLE_SUA_API_KEY") throw new Error("Configure firebase-config.js antes de usar o painel.");
 const app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app);storage=getStorage(app);
 onAuthStateChanged(auth,user=>{currentUser=user;loginBox.classList.toggle("hidden",!!user);adminBox.classList.toggle("hidden",!user);if(user){$("signedIn").textContent="Conectado como "+user.email;loadWorks();}});
} catch(e){$("loginMsg").textContent=e.message;}
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();$("loginMsg").textContent="";try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);}catch(err){$("loginMsg").textContent="Não foi possível entrar. Confira o e-mail, a senha e a configuração do Firebase.";console.error(err);}});
$("logout").addEventListener("click",()=>signOut(auth));
$("clearForm").addEventListener("click",clearForm);
$("workForm").addEventListener("submit",async e=>{
 e.preventDefault();const msg=$("formMsg");msg.textContent="Salvando…";
 try{
  const id=$("workId").value;
  const data={titulo:$("title").value.trim(),cliente:$("client").value.trim(),cidade:$("workCity").value.trim(),categoria:$("workCategory").value,descricao:$("description").value.trim(),publicada:$("published").checked,atualizadaEm:serverTimestamp()};
  let workId=id;
  if(id){await updateDoc(doc(db,"obras",id),data);}else{data.criadaEm=serverTimestamp();const created=await addDoc(collection(db,"obras"),{...data,fotos:[]});workId=created.id;}
  const selected=[...$("photos").files];
  if(selected.length){
   const existing=works.find(w=>w.id===workId)?.fotos||[];
   const uploaded=[];
   for(const file of selected){
    if(!file.type.startsWith("image/")) continue;
    const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
    const path=`obras/${workId}/${Date.now()}_${safe}`;
    const storageRef=ref(storage,path);await uploadBytes(storageRef,file);const url=await getDownloadURL(storageRef);
    const legenda=prompt(`Legenda para a foto "${file.name}":`,"Etapa da obra")||"";
    uploaded.push({url,path,legenda,nomeArquivo:file.name});
   }
   await updateDoc(doc(db,"obras",workId),{...data,fotos:[...existing,...uploaded]});
  }
  msg.textContent="Obra salva com sucesso.";clearForm(false);await loadWorks();
 }catch(err){console.error(err);msg.textContent="Erro ao salvar. Verifique a configuração, as regras do Firebase e sua permissão de administrador.";}
});
async function loadWorks(){
 try{const snap=await getDocs(collection(db,"obras"));works=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.titulo||"").localeCompare(b.titulo||""));renderList();}
 catch(err){console.error(err);$("workList").textContent="Não foi possível carregar as obras. Confira as regras do Firestore.";}
}
function renderList(){
 const list=$("workList");list.innerHTML="";
 if(!works.length){list.textContent="Nenhuma obra cadastrada ainda.";return;}
 works.forEach(w=>{
  const item=document.createElement("div");item.className="rounded-xl border border-slate-700 p-4";
  item.innerHTML=`<div class="flex items-start justify-between gap-3"><div><h3 class="font-bold">${esc(w.titulo||"Sem título")}</h3><p class="mt-1 text-xs text-slate-400">${esc(w.cliente||"Sem cliente")} · ${esc(w.cidade||"")} · ${esc(w.categoria||"")}</p><p class="mt-2 text-xs ${w.publicada?"text-emerald-300":"text-amber-300"}">${w.publicada?"Publicada":"Rascunho"} · ${(w.fotos||[]).length} foto(s)</p></div><div class="flex gap-2"><button data-edit="${w.id}" class="rounded-lg border border-slate-600 px-3 py-1 text-sm">Editar</button><button data-delete="${w.id}" class="rounded-lg border border-rose-900 px-3 py-1 text-sm text-rose-300">Excluir</button></div></div><div class="mt-3 space-y-2">${(w.fotos||[]).map((p,i)=>`<div class="flex items-center gap-3"><img src="${esc(p.url)}" class="h-12 w-16 rounded object-cover"><div class="min-w-0 flex-1"><p class="truncate text-xs">${esc(p.legenda||p.nomeArquivo||"Foto")}</p><button data-caption="${w.id}" data-index="${i}" class="text-xs text-amber-300 underline">Editar legenda</button></div><button data-photo-delete="${w.id}" data-index="${i}" class="text-xs text-rose-300">Remover</button></div>`).join("")}</div>`;
  list.append(item);
 });
 list.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>editWork(b.dataset.edit));
 list.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>removeWork(b.dataset.delete));
 list.querySelectorAll("[data-caption]").forEach(b=>b.onclick=()=>editCaption(b.dataset.caption,Number(b.dataset.index)));
 list.querySelectorAll("[data-photo-delete]").forEach(b=>b.onclick=()=>removePhoto(b.dataset.photoDelete,Number(b.dataset.index)));
}
function editWork(id){const w=works.find(x=>x.id===id);if(!w)return;$("workId").value=w.id;$("title").value=w.titulo||"";$("client").value=w.cliente||"";$("workCity").value=w.cidade||"";$("workCategory").value=w.categoria||"Casas";$("description").value=w.descricao||"";$("published").checked=!!w.publicada;$("formMsg").textContent="Editando obra. Fotos existentes serão mantidas.";window.scrollTo({top:0,behavior:"smooth"});}
async function editCaption(id,index){const w=works.find(x=>x.id===id);const fotos=[...(w.fotos||[])];const legenda=prompt("Nova legenda da foto:",fotos[index]?.legenda||"");if(legenda===null)return;fotos[index].legenda=legenda;await updateDoc(doc(db,"obras",id),{fotos});await loadWorks();}
async function removePhoto(id,index){if(!confirm("Remover esta foto da galeria?"))return;const w=works.find(x=>x.id===id);const fotos=[...(w.fotos||[])];const p=fotos.splice(index,1)[0];try{if(p.path)await deleteObject(ref(storage,p.path));await updateDoc(doc(db,"obras",id),{fotos});await loadWorks();}catch(e){alert("Não foi possível remover a foto. Confira as regras do Storage.");}}
async function removeWork(id){if(!confirm("Excluir esta obra e todas as referências às fotos?"))return;try{const w=works.find(x=>x.id===id);for(const p of (w.fotos||[])){if(p.path)try{await deleteObject(ref(storage,p.path));}catch(e){}}await deleteDoc(doc(db,"obras",id));await loadWorks();}catch(e){alert("Não foi possível excluir a obra.");}}
function clearForm(show=true){$("workForm").reset();$("workId").value="";$("published").checked=true;if(show)$("formMsg").textContent="Formulário limpo.";}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
</script>
</body></html>
