<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <!-- Google tag (gtag.js) -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Galeria de Fotos | Marcão da Graxa</title>
    
    <style>
        :root {
            --bg-dark: #070A0F;
            --card-bg: #0F172A;
            --blue-accent: #0052D4;
            --green-accent: #22C55E;
            --text-light: #F8FAFC;
            --text-muted: #94A3B8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
        }

        /* Header / Navbar */
        header {
            background-color: rgba(7, 10, 15, 0.95);
            padding: 0.8rem 8%;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--blue-accent);
            backdrop-filter: blur(5px);
        }

        .logo-container {
            display: flex;
            align-items: center;
        }

        .logo-img {
            height: 55px;
            width: auto;
            object-fit: contain;
        }

        nav a {
            color: var(--text-light);
            text-decoration: none;
            margin-left: 2rem;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            transition: color 0.3s;
        }

        nav a:hover, nav a.active {
            color: var(--green-accent);
        }

        /* Conteúdo Principal */
        .gallery-container {
            padding: 9rem 8% 5rem;
        }

        .section-title {
            text-align: center;
            font-size: 2.2rem;
            margin-bottom: 1rem;
            position: relative;
        }

        .section-title::after {
            content: '';
            width: 60px;
            height: 4px;
            background: var(--green-accent);
            display: block;
            margin: 0.5rem auto 2rem;
            border-radius: 2px;
        }

        .section-subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 3rem;
            font-size: 1.1rem;
        }

        /* Painel de Cadastro de Fotos */
        .admin-panel {
            background: var(--card-bg);
            border: 1px solid var(--blue-accent);
            padding: 2rem;
            border-radius: 10px;
            margin-bottom: 3rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .admin-panel h3 {
            color: var(--green-accent);
            margin-bottom: 1.2rem;
            font-size: 1.3rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 0.3rem;
        }

        .form-group input, .form-group textarea {
            background: #070A0F;
            border: 1px solid #1E293B;
            padding: 0.7rem;
            border-radius: 6px;
            color: var(--text-light);
            font-size: 0.95rem;
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--green-accent);
        }

        .btn-cadastrar {
            background: linear-gradient(90deg, var(--blue-accent), var(--green-accent));
            color: #fff;
            padding: 0.7rem 1.8rem;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3);
        }

        .btn-cadastrar:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(34, 197, 94, 0.5);
        }

        /* Grid de Fotos */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .photo-card {
            background: var(--card-bg);
            border-radius: 10px;
            border: 1px solid #1E293B;
            border-top: 4px solid var(--blue-accent);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s, border-color 0.3s;
        }

        .photo-card:hover {
            transform: translateY(-5px);
            border-top-color: var(--green-accent);
        }

        .photo-wrapper {
            width: 100%;
            height: 220px;
            overflow: hidden;
            background-color: #030508;
            cursor: pointer;
            position: relative;
        }

        .photo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .photo-card:hover .photo-wrapper img {
            transform: scale(1.05);
        }

        .photo-info {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .photo-title {
            color: var(--green-accent);
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
        }

        .photo-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        /* Modal para Ampliar a Foto (Lightbox) */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(6px);
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .modal-content-container {
            position: relative;
            max-width: 900px;
            width: 100%;
            text-align: center;
        }

        .modal-img {
            max-width: 100%;
            max-height: 75vh;
            border-radius: 8px;
            border: 2px solid var(--blue-accent);
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            object-fit: contain;
        }

        .modal-caption {
            color: var(--text-light);
            margin-top: 1rem;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .close-modal {
            position: absolute;
            top: -40px;
            right: 0;
            color: var(--text-muted);
            font-size: 2.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.3s;
        }

        .close-modal:hover {
            color: #fff;
        }

        /* Rodapé */
        footer {
            background-color: #030508;
            color: var(--text-muted);
            text-align: center;
            padding: 1.5rem;
            font-size: 0.85rem;
            border-top: 1px solid #1E293B;
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                padding: 1rem;
            }

            nav {
                margin-top: 1rem;
            }

            nav a {
                margin: 0 0.5rem;
                font-size: 0.8rem;
            }
        }
    </style>

    <link rel="icon" type="image/png" href="Marcao%20da%20Graxa%20foto.png">
    <link rel="shortcut icon" type="image/png" href="Marcao%20da%20Graxa%20foto.png">
    <link rel="apple-touch-icon" href="Marcao%20da%20Graxa%20foto.png">
</head>

<body>

    <header>
        <div class="logo-container">
            <img src="Marcão da Graxa foto.png" alt="Marcão da Graxa foto" class="logo-img">
            <img src="Marcao da Graxa Nome.png" alt="Marcao da Graxa" class="logo-img">
        </div>
        <nav>
            <a href="index.htm#inicio">Início</a>
            <a href="index.htm#sobre">Sobre</a>
            <a href="index.htm#atuacao">Atuação</a>
            <a href="index.htm#projetos">Produtos</a>
            <a href="fotos.htm" class="active">Fotos</a>
            <a href="index.htm#contato">Contato</a>
        </nav>
    </header>

    <main class="gallery-container">
        <h2 class="section-title">Galeria de Fotos</h2>
        <p class="section-subtitle">Cadastre novas fotos e clique em qualquer imagem para ampliá-la.</p>

        <!-- Painel para Cadastrar Novas Fotos -->
        <div class="admin-panel">
            <h3>➕ Cadastrar Nova Foto</h3>
            <form id="photoForm" onsubmit="addPhoto(event)">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="photoUrl">Nome do arquivo ou URL da Imagem:</label>
                        <input type="text" id="photoUrl" placeholder="ex: foto-equipamento.jpg" required>
                    </div>
                    <div class="form-group">
                        <label for="photoTitle">Título da Foto:</label>
                        <input type="text" id="photoTitle" placeholder="ex: Manutenção em Campo" required>
                    </div>
                </div>
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label for="photoDesc">Descrição:</label>
                    <textarea id="photoDesc" rows="2" placeholder="Breve descrição da foto..." required></textarea>
                </div>
                <button type="submit" class="btn-cadastrar">Adicionar à Galeria</button>
            </form>
        </div>

        <!-- Grid onde as fotos serão renderizadas -->
        <div class="photo-grid" id="photoGrid"></div>
    </main>

    <!-- Modal de Ampliação (Lightbox) -->
    <div id="imageModal" class="modal" onclick="closeModal()">
        <div class="modal-content-container" onclick="event.stopPropagation()">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <img class="modal-img" id="modalImg" src="" alt="Foto Ampliada">
            <div class="modal-caption" id="modalCaption"></div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Bemhes Representação. Parceria • Confiança • Resultados.</p>
    </footer>

    <script>
        // Banco de dados inicial de fotos cadastradas
        let fotos = [
            {
                url: "Marcão da Graxa foto.png",
                titulo: "Atendimento Técnico Especializado",
                descricao: "Demonstração de alta performance e suporte direto para operações agrícolas e industriais na região de Maringá-PR."
            },
            {
                url: "Marcao da Graxa Nome.png",
                titulo: "Portfólio de Soluções NCH Brasil",
                descricao: "Linha completa de lubrificantes, graxas especiais e aditivos voltados para a redução de custos de manutenção."
            },
            {
                url: "https://images.unsplash.com/photo-1581092160607-ee22621dd758?q=80&w=800&auto=format&fit=crop",
                titulo: "Aplicação de Graxa Industrial",
                descricao: "Equipamentos protegidos com tecnologia avançada contra desgaste severo e umidade."
            }
        ];

        // Função para renderizar as fotos na tela
        function renderGallery() {
            const grid = document.getElementById('photoGrid');
            grid.innerHTML = '';

            fotos.forEach((foto, index) => {
                const cardHTML = `
                    <div class="photo-card">
                        <div class="photo-wrapper" onclick="openModal('${foto.url}', '${foto.titulo.replace(/'/g, "\\'")}')">
                            <img src="${foto.url}" alt="${foto.titulo}" onerror="this.src='https://images.unsplash.com/photo-1579373903781-fd5c0c30c4cd?q=80&w=800&auto=format&fit=crop'">
                        </div>
                        <div class="photo-info">
                            <div>
                                <h3 class="photo-title">${foto.titulo}</h3>
                                <p class="photo-desc">${foto.descricao}</p>
                            </div>
                        </div>
                    </div>
                `;
                grid.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        // Função para cadastrar nova foto pelo formulário
        function addPhoto(event) {
            event.preventDefault();

            const url = document.getElementById('photoUrl').value.trim();
            const titulo = document.getElementById('photoTitle').value.trim();
            const descricao = document.getElementById('photoDesc').value.trim();

            if (url && titulo && descricao) {
                fotos.unshift({ url, titulo, descricao }); // Adiciona no início da lista
                renderGallery();
                document.getElementById('photoForm').reset(); // Limpa o formulário
            }
        }

        // Funções do Modal de Ampliação
        function openModal(url, titulo) {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImg');
            const modalCaption = document.getElementById('modalCaption');

            modal.style.display = 'flex';
            modalImg.src = url;
            modalCaption.innerText = titulo;
        }

        function closeModal() {
            document.getElementById('imageModal').style.display = 'none';
        }

        // Inicializar a galeria ao carregar a página
        document.addEventListener('DOMContentLoaded', () => {
            renderGallery();
        });
    </script>

</body>

</html>
